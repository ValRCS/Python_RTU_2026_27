<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">Ikdienas darba cikls</title><desc id="desc">Atjaunini, rediģē un testē, pārbaudi, sagatavo, saglabā un publicē. Atkārto pēc vajadzības.</desc><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#18734b"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#245a94"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#a55a0a"/></marker><marker id="n" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#34465a"/></marker></defs><rect width="1040" height="360" rx="16" fill="#f8fafc"/><text x="520" y="42" font-size="29" font-weight="700" fill="#34465a" text-anchor="middle">Ikdienas darba cikls</text><rect x="40" y="90" width="280" height="72" rx="12" fill="#fff" stroke="#245a94" stroke-width="2"/><text x="180" y="120" font-size="22" font-weight="700" fill="#245a94" text-anchor="middle">1. git pull</text><text x="180" y="146" font-size="18" font-weight="400" fill="#245a94" text-anchor="middle">Saņem izmaiņas</text><rect x="380" y="90" width="280" height="72" rx="12" fill="#fff" stroke="#34465a" stroke-width="2"/><text x="520" y="120" font-size="22" font-weight="700" fill="#34465a" text-anchor="middle">2. Rediģē un testē</text><text x="520" y="146" font-size="18" font-weight="400" fill="#34465a" text-anchor="middle">VS Code / Python</text><rect x="720" y="90" width="280" height="72" rx="12" fill="#fff" stroke="#34465a" stroke-width="2"/><text x="860" y="120" font-size="22" font-weight="700" fill="#34465a" text-anchor="middle">3. status / diff</text><text x="860" y="146" font-size="18" font-weight="400" fill="#34465a" text-anchor="middle">Pārbaudi izmaiņas</text><rect x="720" y="220" width="280" height="72" rx="12" fill="#fff" stroke="#18734b" stroke-width="2"/><text x="860" y="250" font-size="22" font-weight="700" fill="#18734b" text-anchor="middle">4. git add</text><text x="860" y="276" font-size="18" font-weight="400" fill="#18734b" text-anchor="middle">Sagatavo</text><rect x="380" y="220" width="280" height="72" rx="12" fill="#fff" stroke="#18734b" stroke-width="2"/><text x="520" y="250" font-size="22" font-weight="700" fill="#18734b" text-anchor="middle">5. git commit</text><text x="520" y="276" font-size="18" font-weight="400" fill="#18734b" text-anchor="middle">Saglabā lokāli</text><rect x="40" y="220" width="280" height="72" rx="12" fill="#fff" stroke="#18734b" stroke-width="2"/><text x="180" y="250" font-size="22" font-weight="700" fill="#18734b" text-anchor="middle">6. git push</text><text x="180" y="276" font-size="18" font-weight="400" fill="#18734b" text-anchor="middle">Publicē</text><path d="M320 126 H377" fill="none" stroke="#34465a" stroke-width="3" stroke-linejoin="round" marker-end="url(#n)"/><path d="M660 126 H717" fill="none" stroke="#34465a" stroke-width="3" stroke-linejoin="round" marker-end="url(#n)"/><path d="M860 162 V217" fill="none" stroke="#34465a" stroke-width="3" stroke-linejoin="round" marker-end="url(#n)"/><path d="M720 256 H663" fill="none" stroke="#34465a" stroke-width="3" stroke-linejoin="round" marker-end="url(#n)"/><path d="M380 256 H323" fill="none" stroke="#34465a" stroke-width="3" stroke-linejoin="round" marker-end="url(#n)"/><path d="M40 256 H20 V126 H37" fill="none" stroke="#245a94" stroke-width="3" stroke-linejoin="round" marker-end="url(#b)"/><text x="520" y="329" font-size="21" font-weight="500" fill="#34465a" text-anchor="middle">Sāc ar atjauninātu un pārbaudītu darba mapi.</text></svg>