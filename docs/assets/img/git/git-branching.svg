<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">Zari un apvienošana</title><desc id="desc">No main atzarojas feature; main turpinās neatkarīgi. Merge commit savieno abu zaru vēstures.</desc><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#18734b"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#245a94"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#a55a0a"/></marker><marker id="n" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#34465a"/></marker></defs><rect width="1040" height="360" rx="16" fill="#f8fafc"/><text x="520" y="42" font-size="29" font-weight="700" fill="#34465a" text-anchor="middle">Zari un apvienošana</text><path d="M80 124 H950" stroke="#18734b" stroke-width="4" fill="none"/><path d="M240 124 L370 242 H660 L800 124" stroke="#245a94" stroke-width="4" fill="none"/><circle cx="80" cy="124" r="10" fill="#18734b"/><circle cx="240" cy="124" r="10" fill="#18734b"/><circle cx="520" cy="124" r="10" fill="#18734b"/><circle cx="800" cy="124" r="10" fill="#18734b"/><circle cx="950" cy="124" r="10" fill="#18734b"/><circle cx="370" cy="242" r="10" fill="#245a94"/><circle cx="515" cy="242" r="10" fill="#245a94"/><circle cx="660" cy="242" r="10" fill="#245a94"/><text x="80" y="95" font-size="22" font-weight="700" fill="#18734b" text-anchor="middle">main</text><text x="240" y="161" font-size="18" font-weight="700" fill="#245a94" text-anchor="middle" font-family="monospace">git switch -c</text><text x="520" y="95" font-size="18" font-weight="500" fill="#34465a" text-anchor="middle">Cits commit</text><text x="800" y="95" font-size="20" font-weight="700" fill="#18734b" text-anchor="middle" font-family="monospace">git merge</text><text x="515" y="220" font-size="22" font-weight="700" fill="#245a94" text-anchor="middle" font-family="monospace">jauna-funkcija</text><text x="515" y="285" font-size="22" font-weight="500" fill="#34465a" text-anchor="middle">Izstrāde, testi un commit</text><text x="520" y="329" font-size="18" font-weight="400" fill="#34465a" text-anchor="middle">Šeit abos zaros ir izmaiņas; iespējams arī vienkāršs fast-forward.</text></svg>