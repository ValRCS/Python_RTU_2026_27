<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 340" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">git fetch un git pull</title><desc id="desc">Fetch saņem commit un atjaunina origin/main, bet nemaina main vai darba failus. Integrēšana atjaunina pašreizējo zaru un darba failus.</desc><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#18734b"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#245a94"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#a55a0a"/></marker><marker id="n" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#34465a"/></marker></defs><rect width="1040" height="340" rx="16" fill="#f8fafc"/><text x="520" y="42" font-size="29" font-weight="700" fill="#34465a" text-anchor="middle">git fetch un git pull</text><rect x="30" y="110" width="280" height="100" rx="12" fill="#fff" stroke="#245a94" stroke-width="2"/><text x="170" y="154" font-size="22" font-weight="700" fill="#245a94" text-anchor="middle">GitHub / GitLab</text><text x="170" y="180" font-size="18" font-weight="400" fill="#245a94" text-anchor="middle">Attālinātais main</text><rect x="380" y="110" width="280" height="100" rx="12" fill="#fff" stroke="#245a94" stroke-width="2"/><text x="520" y="154" font-size="22" font-weight="700" fill="#245a94" text-anchor="middle">Lokālais .git</text><text x="520" y="180" font-size="18" font-weight="400" fill="#245a94" text-anchor="middle">origin/main</text><rect x="730" y="110" width="280" height="100" rx="12" fill="#fff" stroke="#18734b" stroke-width="2"/><text x="870" y="154" font-size="22" font-weight="700" fill="#18734b" text-anchor="middle">Lokālais main</text><text x="870" y="180" font-size="18" font-weight="400" fill="#18734b" text-anchor="middle">Darba mape</text><path d="M310 160 H377" fill="none" stroke="#245a94" stroke-width="3" stroke-linejoin="round" marker-end="url(#b)"/><path d="M660 160 H727" fill="none" stroke="#245a94" stroke-width="3" stroke-linejoin="round" marker-end="url(#b)"/><text x="345" y="92" font-size="20" font-weight="700" fill="#245a94" text-anchor="middle" font-family="monospace">fetch</text><text x="695" y="92" font-size="19" font-weight="700" fill="#245a94" text-anchor="middle" font-family="monospace">merge / rebase*</text><text x="520" y="258" font-size="26" font-weight="700" fill="#245a94" text-anchor="middle">git pull = fetch + integrēšana</text><text x="520" y="300" font-size="18" font-weight="400" fill="#34465a" text-anchor="middle">* Atkarībā no izvēlētās stratēģijas; --ff-only pieļauj tikai fast-forward.</text></svg>