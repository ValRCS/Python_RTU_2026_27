<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">Git darba plūsmas</title><desc id="desc">Darba mape, sagatavošanas zona, lokālais repozitorijs un attālinātais repozitorijs. Zaļās bultas rāda add, commit un push. Zilās rāda fetch un integrēšanu.</desc><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#18734b"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#245a94"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#a55a0a"/></marker><marker id="n" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#34465a"/></marker></defs><rect width="1120" height="510" rx="16" fill="#f8fafc"/><text x="560" y="42" font-size="29" font-weight="700" fill="#34465a" text-anchor="middle">Git darba plūsmas</text><rect x="18" y="70" width="805" height="366" rx="14" fill="#eaf0f6" stroke="#98a9bb" stroke-dasharray="7 5"/><rect x="837" y="70" width="265" height="366" rx="14" fill="#eef4fb" stroke="#98a9bb" stroke-dasharray="7 5"/><text x="420" y="105" font-size="22" font-weight="700" fill="#34465a" text-anchor="middle">TAVS DATORS</text><text x="970" y="105" font-size="22" font-weight="700" fill="#34465a" text-anchor="middle">ATTĀLINĀTI</text><rect x="34" y="200" width="214" height="100" rx="12" fill="#fff" stroke="#245a94" stroke-width="2"/><text x="141" y="231" font-size="22" font-weight="700" fill="#245a94" text-anchor="middle">Darba mape</text><text x="141" y="257" font-size="18" font-weight="400" fill="#245a94" text-anchor="middle">Working directory</text><text x="141" y="283" font-size="18" font-weight="400" fill="#245a94" text-anchor="middle">Python faili</text><rect x="307" y="200" width="214" height="100" rx="12" fill="#fff" stroke="#a55a0a" stroke-width="2"/><text x="414" y="231" font-size="22" font-weight="700" fill="#a55a0a" text-anchor="middle">Sagatavošana</text><text x="414" y="257" font-size="18" font-weight="400" fill="#a55a0a" text-anchor="middle">Staging area</text><text x="414" y="283" font-size="18" font-weight="400" fill="#a55a0a" text-anchor="middle">Nākamais commit</text><rect x="580" y="200" width="228" height="100" rx="12" fill="#fff" stroke="#18734b" stroke-width="2"/><text x="694" y="231" font-size="22" font-weight="700" fill="#18734b" text-anchor="middle">Lokālais Git</text><text x="694" y="257" font-size="18" font-weight="400" fill="#18734b" text-anchor="middle">.git / commits</text><text x="694" y="283" font-size="18" font-weight="400" fill="#18734b" text-anchor="middle">main, origin/main</text><rect x="850" y="200" width="240" height="100" rx="12" fill="#fff" stroke="#245a94" stroke-width="2"/><text x="970" y="231" font-size="22" font-weight="700" fill="#245a94" text-anchor="middle">GitHub / GitLab</text><text x="970" y="257" font-size="18" font-weight="400" fill="#245a94" text-anchor="middle">Remote repository</text><text x="970" y="283" font-size="18" font-weight="400" fill="#245a94" text-anchor="middle">origin</text><path d="M248 250 H304" fill="none" stroke="#18734b" stroke-width="3" stroke-linejoin="round" marker-end="url(#g)"/><text x="277" y="187" font-size="17" font-weight="700" fill="#18734b" text-anchor="middle" font-family="monospace">git add</text><path d="M521 250 H577" fill="none" stroke="#18734b" stroke-width="3" stroke-linejoin="round" marker-end="url(#g)"/><text x="550" y="187" font-size="17" font-weight="700" fill="#18734b" text-anchor="middle" font-family="monospace">git commit</text><path d="M808 232 H847" fill="none" stroke="#18734b" stroke-width="3" stroke-linejoin="round" marker-end="url(#g)"/><text x="830" y="168" font-size="17" font-weight="700" fill="#18734b" text-anchor="middle" font-family="monospace">git push</text><path d="M970 300 V340 H694 V303" fill="none" stroke="#245a94" stroke-width="3" stroke-linejoin="round" marker-end="url(#b)"/><text x="832" y="363" font-size="19" font-weight="700" fill="#245a94" text-anchor="middle" font-family="monospace">git fetch</text><path d="M650 200 V134 H141 V197" fill="none" stroke="#245a94" stroke-width="3" stroke-linejoin="round" marker-end="url(#b)"/><text x="395" y="126" font-size="19" font-weight="700" fill="#245a94" text-anchor="middle">Integrēšana / git switch</text><text x="560" y="405" font-size="23" font-weight="700" fill="#245a94" text-anchor="middle">git pull = git fetch + integrēšana pašreizējā zarā</text><text x="560" y="474" font-size="20" font-weight="500" fill="#34465a" text-anchor="middle">Zaļš: saglabā un publicē   •   Zils: saņem vai atjaunina darba versiju</text></svg>