<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">Divi veidi, kā sākt projektu</title><desc id="desc">Esošu projektu klonē. Jaunu projektu inicializē lokāli, sagatavo failus, izveido commit un pēc vēlēšanās publicē.</desc><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#18734b"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#245a94"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#a55a0a"/></marker><marker id="n" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#34465a"/></marker></defs><rect width="1040" height="380" rx="16" fill="#f8fafc"/><text x="520" y="42" font-size="29" font-weight="700" fill="#34465a" text-anchor="middle">Divi veidi, kā sākt projektu</text><text x="30" y="85" font-size="22" font-weight="700" fill="#34465a" text-anchor="start">A. Esošs projekts</text><rect x="30" y="110" width="280" height="72" rx="12" fill="#fff" stroke="#245a94" stroke-width="2"/><text x="170" y="140" font-size="22" font-weight="700" fill="#245a94" text-anchor="middle">GitHub / GitLab</text><text x="170" y="166" font-size="18" font-weight="400" fill="#245a94" text-anchor="middle">Esošs repozitorijs</text><rect x="730" y="110" width="280" height="72" rx="12" fill="#fff" stroke="#245a94" stroke-width="2"/><text x="870" y="140" font-size="22" font-weight="700" fill="#245a94" text-anchor="middle">Tavs dators</text><text x="870" y="166" font-size="18" font-weight="400" fill="#245a94" text-anchor="middle">Lokālā kopija</text><path d="M310 146 H727" fill="none" stroke="#245a94" stroke-width="3" stroke-linejoin="round" marker-end="url(#b)"/><text x="520" y="133" font-size="22" font-weight="700" fill="#245a94" text-anchor="middle" font-family="monospace">git clone URL</text><text x="30" y="229" font-size="22" font-weight="700" fill="#34465a" text-anchor="start">B. Jauns lokālais projekts</text><rect x="30" y="260" width="215" height="72" rx="12" fill="#fff" stroke="#18734b" stroke-width="2"/><text x="137.5" y="290" font-size="22" font-weight="700" fill="#18734b" text-anchor="middle">git init</text><text x="137.5" y="316" font-size="18" font-weight="400" fill="#18734b" text-anchor="middle">Izveido Git</text><rect x="285" y="260" width="215" height="72" rx="12" fill="#fff" stroke="#18734b" stroke-width="2"/><text x="392.5" y="290" font-size="22" font-weight="700" fill="#18734b" text-anchor="middle">add + commit</text><text x="392.5" y="316" font-size="18" font-weight="400" fill="#18734b" text-anchor="middle">Pirmā versija</text><rect x="540" y="260" width="215" height="72" rx="12" fill="#fff" stroke="#34465a" stroke-width="2"/><text x="647.5" y="290" font-size="22" font-weight="700" fill="#34465a" text-anchor="middle">remote add</text><text x="647.5" y="316" font-size="18" font-weight="400" fill="#34465a" text-anchor="middle">Piesaisti origin</text><rect x="795" y="260" width="215" height="72" rx="12" fill="#fff" stroke="#18734b" stroke-width="2"/><text x="902.5" y="290" font-size="22" font-weight="700" fill="#18734b" text-anchor="middle">git push</text><text x="902.5" y="316" font-size="18" font-weight="400" fill="#18734b" text-anchor="middle">Publicē</text><path d="M245 296 H282" fill="none" stroke="#18734b" stroke-width="3" stroke-linejoin="round" marker-end="url(#g)"/><path d="M500 296 H537" fill="none" stroke="#18734b" stroke-width="3" stroke-linejoin="round" marker-end="url(#g)"/><path d="M755 296 H792" fill="none" stroke="#18734b" stroke-width="3" stroke-linejoin="round" marker-end="url(#g)"/><text x="520" y="362" font-size="18" font-weight="400" fill="#34465a" text-anchor="middle">Attālinātais repozitorijs B variantā sākotnēji ir tukšs.</text></svg>